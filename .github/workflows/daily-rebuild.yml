# Rebuilds the site every night so events move from "upcoming" to "past".
name: daily-rebuild
on:
  schedule: [{ cron: '10 22 * * *' }]  # 22:10 UTC = after midnight in Berlin
  workflow_dispatch:
jobs:
  hook:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
